<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Choose a Walt Disney World park to view live wait times."
  >

  <meta name="theme-color" content="#07111f">

  <title>Wait Times | DisneyOS</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">

  <link
    rel="icon"
    type="image/png"
    href="assets/icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icons/icon-192.png"
  >

  <style>
    .utility-page-header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .utility-back-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;

      width: 44px;
      height: 44px;
      padding: 0;

      border: 1px solid var(--border-strong);
      border-radius: 14px;

      background: var(--surface-soft);

      color: var(--text-primary);
      font-size: 1.55rem;
      line-height: 1;
      cursor: pointer;
    }

    .utility-page-main {
      width: min(100%, var(--content-width));
      margin: 0 auto;
      padding:
        0
        var(--space-5)
        calc(var(--space-8) + env(safe-area-inset-bottom));
    }

    .park-choice-button {
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .park-choice-button:active {
      transform: scale(0.975);
    }

    @media (min-width: 560px) {
      .utility-page-main {
        padding-right: var(--space-7);
        padding-left: var(--space-7);
      }
    }

    @media (max-width: 370px) {
      .utility-page-main {
        padding-right: var(--space-4);
        padding-left: var(--space-4);
      }
    }
  </style>
</head>

<body>

  <div class="app-shell">

    <header class="app-header">

      <div class="header-content utility-page-header">

        <button
          class="utility-back-button"
          type="button"
          id="back-button"
          aria-label="Return to DisneyOS Shortcuts"
        >
          ‹
        </button>

        <div>
          <p class="eyebrow">
            DisneyOS Shortcuts
          </p>

          <h1>
            Wait Times
          </h1>
        </div>

      </div>

    </header>

    <main class="utility-page-main">

      <div class="page-title-block">
        <p>
          Choose a park to view current attraction wait times.
        </p>
      </div>

      <div class="menu-card-list">

        <button
          class="menu-card park-choice-button"
          type="button"
          data-park="magic-kingdom"
        >
          <span class="menu-card-icon">🏰</span>

          <span>
            <strong>Magic Kingdom</strong>
            <small>View live attraction waits</small>
          </span>

          <span class="menu-card-arrow">›</span>
        </button>

        <button
          class="menu-card park-choice-button"
          type="button"
          data-park="epcot"
        >
          <span class="menu-card-icon">🌐</span>

          <span>
            <strong>EPCOT</strong>
            <small>View live attraction waits</small>
          </span>

          <span class="menu-card-arrow">›</span>
        </button>

        <button
          class="menu-card park-choice-button"
          type="button"
          data-park="hollywood-studios"
        >
          <span class="menu-card-icon">🎬</span>

          <span>
            <strong>Hollywood Studios</strong>
            <small>View live attraction waits</small>
          </span>

          <span class="menu-card-arrow">›</span>
        </button>

        <button
          class="menu-card park-choice-button"
          type="button"
          data-park="animal-kingdom"
        >
          <span class="menu-card-icon">🌳</span>

          <span>
            <strong>Animal Kingdom</strong>
            <small>View live attraction waits</small>
          </span>

          <span class="menu-card-arrow">›</span>
        </button>

      </div>

    </main>

  </div>

  <script>
    const disneyOSRoot = "https://disneyos.github.io/";

    document
      .getElementById("back-button")
      .addEventListener("click", () => {
        window.location.assign(disneyOSRoot);
      });

    document
      .querySelectorAll("[data-park]")
      .forEach((button) => {
        button.addEventListener("click", () => {
          const park = button.dataset.park;

          window.location.assign(
            `${disneyOSRoot}wait-times.html?park=${encodeURIComponent(park)}`
          );
        });
      });
  </script>

</body>
</html>
