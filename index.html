<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>DisneyOS</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#05070c}body{display:grid;place-items:center}.mark{width:72px;height:72px;object-fit:contain;opacity:0;animation:reveal .18s ease .18s forwards;filter:drop-shadow(0 12px 30px rgba(35,136,255,.24))}@keyframes reveal{to{opacity:1}}@media(prefers-reduced-motion:reduce){.mark{animation:none;opacity:1}}
  </style>
</head>
<body>
  <img class="mark" src="assets/disneyos-mark.png" alt="">
  <noscript><meta http-equiv="refresh" content="0;url=./v1/"></noscript>
  <script>
    (async () => {
      try {
        const response = await fetch("./latest.json", { cache: "no-store" });
        if (!response.ok) throw new Error("latest.json unavailable");
        const data = await response.json();
        if (!data.current || !/^v[0-9]+$/.test(data.current)) throw new Error("invalid version");
        const destination = new URL(`./${data.current}/`, window.location.href);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      } catch (error) {
        window.location.replace(new URL("./v1/", window.location.href).href);
      }
    })();
  </script>
</body>
</html>
